name: Build

# Builds the data product (grpop-build) from the latest snapshot of each source in the
# `snapshots` release, twice from scratch, and fails unless both give the same files
# (Phase 1 criterion). The build itself fails on any difference from Eurostat that is
# neither listed nor corroborated. Then renders the Quarto site from the product, and
# checks that the deliberately wrong pages in site/test/ fail to render (a value that is
# missing or has no provenance), checks every local link and runs axe on each kind of page.
# Runs after each Ingest run, on demand, and on every push
# that changes the code, the reference data, the site, the charts or the design tokens.
# Run by hand with `deploy` ticked, on main, it also publishes the site on GitHub Pages.
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Publish the rendered site on GitHub Pages (public; main only)"
        type: boolean
        default: false
  workflow_run:
    workflows: [Ingest]
    types: [completed]
  push:
    paths:
      - .github/workflows/build.yml
      - .github/scripts/restore-snapshots.sh
      - pipeline/src/**
      - pipeline/uv.lock
      - data/reference/**
      - site/**
      - charts/src/**
      - charts/package-lock.json
      - design/src/**
      - design/tokens.json
      - design/package-lock.json

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Restore the latest snapshots
        run: bash ../.github/scripts/restore-snapshots.sh
      - run: uv run grpop-build --store store --out product
      - run: uv run grpop-build --store store --out product-again
      - name: Compare the two builds
        run: |
          diff -r product product-again
          echo "Two builds from scratch are identical." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            design/package-lock.json
            charts/package-lock.json
            site/package-lock.json
      # site/ imports the charts and the design tokens.
      - name: Install the Node packages
        working-directory: .
        run: for p in design charts site; do (cd $p && npm ci); done
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.11.5
      - name: Render the site from the data product
        working-directory: site
        env:
          KOHORTES_DATA: ${{ github.workspace }}/pipeline/product
        run: |
          quarto render
          grep -q 'class="fact"' _site/index.html || { echo "::error::no value from the data product in index.html"; exit 1; }
          node src/cli.js links
      - name: Accessibility of each kind of page (axe)
        working-directory: site
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/_site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site
      - name: Deliberately wrong pages fail the render
        working-directory: site
        env:
          KOHORTES_DATA: ${{ github.workspace }}/pipeline/product
        run: |
          check() {
            if quarto render "$1" --profile wrong > render.log 2>&1; then
              cat render.log; echo "::error::$1 rendered, but it must fail"; exit 1
            fi
            cat render.log
            grep -q "kohortes: .*$2" render.log || { echo "::error::$1 failed for another reason"; exit 1; }
          }
          check test/missing.qmd "0 values in the data product"
          check test/unprovenanced.qmd "not in the data product manifest"
          echo "The site renders; pages with a missing or unprovenanced value fail." >> "$GITHUB_STEP_SUMMARY"

  # Publishing is a separate, deliberate act: by hand, from main, with deploy ticked.
  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
