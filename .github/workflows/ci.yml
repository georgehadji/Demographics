name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q

  design:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: design
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: design/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            design/package-lock.json
            charts/package-lock.json
      # charts imports the tokens and the number formatter from design/.
      - run: npm ci
        working-directory: design
      - run: npm ci
        working-directory: charts
      - run: npm test
        working-directory: charts

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            design/package-lock.json
            charts/package-lock.json
            site/package-lock.json
      # site imports the charts and the design tokens; Quarto renders it in the Build workflow.
      - run: for p in design charts site; do (cd $p && npm ci); done
      - run: npm test
        working-directory: site
