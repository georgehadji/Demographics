# Metric definitions: the single source of truth for what a definition_id means.
#
# Every definition_id written into an observation is defined here exactly once.
# Parsers and indicators read `metric` and `unit` from this file instead of
# typing them. Changing what a definition means requires a new version (@v2);
# the old version stays so that published values keep their meaning.

- id: population_1jan@v1
  metric: population
  unit: persons
  title: Population on 1 January
  description: >-
    Usual resident population on 1 January of the reference year. The period is
    the year (YYYY), as in Eurostat demo_pjan.

- id: population_1jul@v1
  metric: population
  unit: persons
  title: Population on 1 July
  description: >-
    Total population on 1 July of the reference year, as the UN World Population
    Prospects define it (de facto, the whole territory of the country or area). Not
    comparable value for value with population_1jan@v1: other reference date and
    population concept.

- id: old_age_dependency_ratio@v1
  metric: old_age_dependency_ratio
  unit: per 100 persons aged 15-64
  title: Old-age dependency ratio
  description: >-
    Persons aged 65 and over per 100 persons aged 15 to 64, on 1 January. Persons of
    unknown age are excluded. The same ratio as Eurostat demo_pjanind OLDDEP1.

- id: young_age_dependency_ratio@v1
  metric: young_age_dependency_ratio
  unit: per 100 persons aged 15-64
  title: Young-age dependency ratio
  description: >-
    Persons aged 0 to 14 per 100 persons aged 15 to 64, on 1 January. The same ratio
    as Eurostat demo_pjanind YOUNGDEP1.

- id: total_age_dependency_ratio@v1
  metric: total_age_dependency_ratio
  unit: per 100 persons aged 15-64
  title: Total age dependency ratio
  description: >-
    Persons aged 0 to 14 and 65 and over per 100 persons aged 15 to 64, on 1 January.
    Persons of unknown age are excluded. The same ratio as Eurostat demo_pjanind
    DEPRATIO1.

- id: ageing_index@v1
  metric: ageing_index
  unit: per 100 persons aged 0-14
  title: Ageing index
  description: >-
    Persons aged 65 and over per 100 persons aged 0 to 14, on 1 January. Persons of
    unknown age are excluded. Not in Eurostat demo_pjanind.

- id: population_share@v1
  metric: population_share
  unit: "% of persons of known age"
  title: Share of the population in an age band
  description: >-
    Persons in the age band (the age column, e.g. 0-14 or 80+) per 100 persons of
    known age, on 1 January. As Eurostat demo_pjanind PC_Y0_14, PC_Y15_64, PC_Y65_MAX
    and PC_Y80_MAX.

- id: median_age@v1
  metric: median_age
  unit: years
  title: Median age of the population
  description: >-
    The age that divides persons of known age into two equal halves on 1 January,
    interpolated linearly within the single year of age. As Eurostat demo_pjanind
    MEDAGEPOP, MMEDAGEPOP and FMEDAGEPOP.

- id: population_change@v1
  metric: population_change
  unit: persons
  title: Total population change
  description: >-
    Population on 1 January of the next year minus population on 1 January of the
    reference year, as Eurostat demo_gind GROW (natural change plus net migration
    and statistical adjustment).

- id: average_population@v1
  metric: average_population
  unit: persons
  title: Average population
  description: >-
    Average population of the reference year, as Eurostat demo_gind AVG.

- id: population_growth_rate@v1
  metric: population_growth_rate
  unit: per 1000 average population
  title: Crude rate of population change
  description: >-
    Total population change during the year per 1000 of the average population. The
    same rate as Eurostat demo_gind GROWRT.

- id: natural_change@v1
  metric: natural_change
  unit: persons
  title: Natural change
  description: >-
    Live births minus deaths during the reference year, as Eurostat demo_gind NATGROW.

- id: net_migration@v1
  metric: net_migration
  unit: persons
  title: Net migration plus statistical adjustment
  description: >-
    Total population change minus natural change during the reference year, as
    Eurostat demo_gind CNMIGRAT. It is a residual, not a count of migrants: it also
    absorbs statistical adjustments.

- id: fertility_rate@v1
  metric: fertility_rate
  unit: live births per woman
  title: Age-specific fertility rate
  description: >-
    Live births to women of the age (the age column) per woman of that age, as
    Eurostat demo_frate. Age is age in completed years; 10-14 and 50+ are open classes.

- id: total_fertility_rate@v1
  metric: total_fertility_rate
  unit: live births per woman
  title: Total fertility rate
  description: >-
    Sum of the age-specific fertility rates of the reference year: the mean number of
    children a woman would have at those rates. As Eurostat demo_find TOTFERRT.

- id: mean_age_first_birth@v1
  metric: mean_age_first_birth
  unit: years
  title: Mean age of women at birth of first child
  description: >-
    As Eurostat demo_find AGEMOTH1.

- id: life_expectancy@v1
  metric: life_expectancy
  unit: years
  title: Life expectancy
  description: >-
    Mean number of further years a person of the exact age (the age column; 0 is at
    birth) would live at the mortality rates of the reference year, as Eurostat
    demo_mlexpec.

- id: infant_mortality_rate@v1
  metric: infant_mortality_rate
  unit: per 1000 live births
  title: Infant mortality rate
  description: >-
    Deaths of children under one year of age per 1000 live births in the reference
    year, as Eurostat demo_minfind INFMORRT.
