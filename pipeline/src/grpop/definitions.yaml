# Metric definitions: the single source of truth for what a definition_id means.
#
# Every definition_id written into an observation is defined here exactly once.
# Parsers and indicators read `metric` and `unit` from this file instead of
# typing them. Changing what a definition means requires a new version (@v2);
# the old version stays so that published values keep their meaning.

- id: population_1jan@v1
  metric: population
  unit: persons
  title: Population on 1 January
  description: >-
    Usual resident population on 1 January of the reference year. The period is
    the year (YYYY), as in Eurostat demo_pjan.
  el:
    title: Πληθυσμός την 1η Ιανουαρίου
    description: >-
      Ο μόνιμος πληθυσμός, δηλαδή τα άτομα που ζουν συνήθως στη χώρα ή στην περιοχή,
      την 1η Ιανουαρίου του έτους αναφοράς, όπως τον δημοσιεύει η Eurostat.

- id: population_1jul@v1
  metric: population
  unit: persons
  title: Population on 1 July
  description: >-
    Total population on 1 July of the reference year, as the UN World Population
    Prospects define it (de facto, the whole territory of the country or area). Not
    comparable value for value with population_1jan@v1: other reference date and
    population concept.
  el:
    title: Πληθυσμός την 1η Ιουλίου
    description: >-
      Ο συνολικός πληθυσμός την 1η Ιουλίου του έτους αναφοράς, όπως τον ορίζουν οι
      Παγκόσμιες Πληθυσμιακές Προοπτικές του ΟΗΕ (πραγματικός πληθυσμός σε όλη την
      επικράτεια). Δεν συγκρίνεται τιμή προς τιμή με τον πληθυσμό της 1ης
      Ιανουαρίου: άλλη ημερομηνία αναφοράς και άλλη έννοια πληθυσμού.

- id: old_age_dependency_ratio@v1
  metric: old_age_dependency_ratio
  unit: per 100 persons aged 15-64
  title: Old-age dependency ratio
  description: >-
    Persons aged 65 and over per 100 persons aged 15 to 64, on 1 January. Persons of
    unknown age are excluded. The same ratio as Eurostat demo_pjanind OLDDEP1.
  el:
    title: Δείκτης εξάρτησης ηλικιωμένων
    description: >-
      Άτομα 65 ετών και άνω ανά 100 άτομα 15–64 ετών, την 1η Ιανουαρίου. Τα άτομα
      άγνωστης ηλικίας δεν μετρούν. Ίδιος με τον δείκτη που δημοσιεύει η Eurostat.

- id: young_age_dependency_ratio@v1
  metric: young_age_dependency_ratio
  unit: per 100 persons aged 15-64
  title: Young-age dependency ratio
  description: >-
    Persons aged 0 to 14 per 100 persons aged 15 to 64, on 1 January. The same ratio
    as Eurostat demo_pjanind YOUNGDEP1.
  el:
    title: Δείκτης εξάρτησης νέων
    description: >-
      Άτομα 0–14 ετών ανά 100 άτομα 15–64 ετών, την 1η Ιανουαρίου. Ίδιος με τον
      δείκτη που δημοσιεύει η Eurostat.

- id: total_age_dependency_ratio@v1
  metric: total_age_dependency_ratio
  unit: per 100 persons aged 15-64
  title: Total age dependency ratio
  description: >-
    Persons aged 0 to 14 and 65 and over per 100 persons aged 15 to 64, on 1 January.
    Persons of unknown age are excluded. The same ratio as Eurostat demo_pjanind
    DEPRATIO1.
  el:
    title: Συνολικός δείκτης εξάρτησης
    description: >-
      Άτομα 0–14 ετών και 65 ετών και άνω ανά 100 άτομα 15–64 ετών, την 1η
      Ιανουαρίου. Τα άτομα άγνωστης ηλικίας δεν μετρούν. Ίδιος με τον δείκτη που
      δημοσιεύει η Eurostat.

- id: ageing_index@v1
  metric: ageing_index
  unit: per 100 persons aged 0-14
  title: Ageing index
  description: >-
    Persons aged 65 and over per 100 persons aged 0 to 14, on 1 January. Persons of
    unknown age are excluded. Not in Eurostat demo_pjanind.
  el:
    title: Δείκτης γήρανσης
    description: >-
      Άτομα 65 ετών και άνω ανά 100 άτομα 0–14 ετών, την 1η Ιανουαρίου. Τα άτομα
      άγνωστης ηλικίας δεν μετρούν. Η Eurostat δεν τον δημοσιεύει· τον υπολογίζουμε
      από τον πληθυσμό κατά ηλικία.

- id: population_share@v1
  metric: population_share
  unit: "% of persons of known age"
  title: Share of the population in an age band
  description: >-
    Persons in the age band (the age column, e.g. 0-14 or 80+) per 100 persons of
    known age, on 1 January. As Eurostat demo_pjanind PC_Y0_14, PC_Y15_64, PC_Y65_MAX
    and PC_Y80_MAX.
  el:
    title: Μερίδιο του πληθυσμού σε μια ηλικιακή ομάδα
    description: >-
      Άτομα της ηλικιακής ομάδας (για παράδειγμα 0–14 ή 80+) ανά 100 άτομα γνωστής
      ηλικίας, την 1η Ιανουαρίου.

- id: median_age@v1
  metric: median_age
  unit: years
  title: Median age of the population
  description: >-
    The age that divides persons of known age into two equal halves on 1 January,
    interpolated linearly within the single year of age. As Eurostat demo_pjanind
    MEDAGEPOP, MMEDAGEPOP and FMEDAGEPOP.
  el:
    title: Διάμεση ηλικία του πληθυσμού
    description: >-
      Η ηλικία που χωρίζει τα άτομα γνωστής ηλικίας σε δύο ίσα μισά την 1η
      Ιανουαρίου: οι μισοί είναι νεότεροι και οι μισοί μεγαλύτεροι. Υπολογίζεται με
      γραμμική παρεμβολή μέσα στο έτος ηλικίας.

- id: population_change@v1
  metric: population_change
  unit: persons
  title: Total population change
  description: >-
    Population on 1 January of the next year minus population on 1 January of the
    reference year, as Eurostat demo_gind GROW (natural change plus net migration
    and statistical adjustment).
  el:
    title: Συνολική μεταβολή του πληθυσμού
    description: >-
      Ο πληθυσμός της 1ης Ιανουαρίου του επόμενου έτους μείον τον πληθυσμό της 1ης
      Ιανουαρίου του έτους αναφοράς: η φυσική μεταβολή συν την καθαρή μετανάστευση
      και τη στατιστική προσαρμογή.

- id: average_population@v1
  metric: average_population
  unit: persons
  title: Average population
  description: >-
    Average population of the reference year, as Eurostat demo_gind AVG.
  el:
    title: Μέσος πληθυσμός
    description: >-
      Ο μέσος πληθυσμός του έτους αναφοράς, όπως τον δημοσιεύει η Eurostat: ο μέσος
      όρος του πληθυσμού την 1η Ιανουαρίου του έτους και του επόμενου.

- id: population_growth_rate@v1
  metric: population_growth_rate
  unit: per 1000 average population
  title: Crude rate of population change
  description: >-
    Total population change during the year per 1000 of the average population. The
    same rate as Eurostat demo_gind GROWRT.
  el:
    title: Ρυθμός μεταβολής του πληθυσμού
    description: >-
      Η συνολική μεταβολή του πληθυσμού μέσα στο έτος ανά 1.000 κατοίκους του μέσου
      πληθυσμού.

- id: natural_change@v1
  metric: natural_change
  unit: persons
  title: Natural change
  description: >-
    Live births minus deaths during the reference year (Eurostat demo_gind NATGROW;
    ELSTAT natural movement of population).
  el:
    title: Φυσική μεταβολή
    description: >-
      Οι γεννήσεις ζώντων μείον τους θανάτους μέσα στο έτος αναφοράς.

- id: live_births@v1
  metric: live_births
  unit: persons
  title: Live births
  description: >-
    Live births during the reference year, by the place of usual residence of the
    mother. Stillbirths are not included. By age, the age is the mother's.
  el:
    title: Γεννήσεις ζώντων
    description: >-
      Οι γεννήσεις ζώντων μέσα στο έτος αναφοράς, κατά τόπο μόνιμης κατοικίας της
      μητέρας. Δεν περιλαμβάνονται οι γεννήσεις νεκρών. Κατά ηλικία, η ηλικία είναι
      της μητέρας.

- id: deaths@v1
  metric: deaths
  unit: persons
  title: Deaths
  description: >-
    Deaths during the reference year, by the place of usual residence of the deceased.
    ELSTAT's count excludes migrants and refugees who died trying to reach Europe.
  el:
    title: Θάνατοι
    description: >-
      Οι θάνατοι μέσα στο έτος αναφοράς, κατά τόπο μόνιμης κατοικίας του θανόντα. Η
      ΕΛΣΤΑΤ δεν μετρά τους θανάτους μεταναστών και προσφύγων κατά την προσπάθεια να
      φτάσουν σε ευρωπαϊκή χώρα.

- id: live_births_foreign_citizen_mother@v1
  metric: live_births_foreign_citizen_mother
  unit: persons
  title: Live births to mothers of foreign citizenship
  description: >-
    Live births during the reference year whose mother is not a Greek citizen, by
    citizenship as registered (not country of birth). Births whose mother's
    citizenship was not declared are counted neither here nor as Greek.
  el:
    title: Γεννήσεις ζώντων από μητέρες με αλλοδαπή υπηκοότητα
    description: >-
      Οι γεννήσεις ζώντων του έτους αναφοράς από μητέρες που δεν έχουν ελληνική
      υπηκοότητα, όπως δηλώθηκε (όχι κατά χώρα γέννησης). Οι γεννήσεις χωρίς δηλωμένη
      υπηκοότητα της μητέρας δεν μετρούν ούτε εδώ ούτε στις ελληνίδες μητέρες.

- id: live_births_outside_marriage@v1
  metric: live_births_outside_marriage
  unit: persons
  title: Live births outside marriage or registered partnership
  description: >-
    Live births during the reference year whose parents are neither married nor in a
    registered partnership (σύμφωνο συμβίωσης), as ELSTAT groups them.
  el:
    title: Γεννήσεις ζώντων εκτός γάμου ή συμφώνου συμβίωσης
    description: >-
      Οι γεννήσεις ζώντων του έτους αναφοράς από γονείς που δεν είναι ούτε παντρεμένοι
      ούτε σε σύμφωνο συμβίωσης, όπως τις ομαδοποιεί η ΕΛΣΤΑΤ.

- id: stillbirths@v1
  metric: stillbirths
  unit: stillbirths
  title: Stillbirths
  description: >-
    Fetal deaths registered during the reference year, as ELSTAT counts them. In 2019
    ELSTAT lowered the gestational age from which a fetus counts as viable from 25 to
    22 weeks: counts before and after are not fully comparable (break in series).
  el:
    title: Γεννήσεις νεκρών
    description: >-
      Οι εμβρυϊκοί θάνατοι που καταχωρίστηκαν μέσα στο έτος αναφοράς, όπως τους μετρά
      η ΕΛΣΤΑΤ. Το 2019 η ΕΛΣΤΑΤ μείωσε το όριο βιωσιμότητας από τις 25 στις 22
      εβδομάδες κύησης: οι τιμές πριν και μετά δεν συγκρίνονται πλήρως (διακοπή σειράς).

- id: perinatal_mortality_rate@v1
  metric: perinatal_mortality_rate
  unit: per 1000 total births
  title: Perinatal mortality rate
  description: >-
    Stillbirths plus deaths of infants aged up to 6 days during the reference year,
    per 1000 total births (live births plus stillbirths) of the same year, as ELSTAT
    defines it. Affected by the 2019 break in stillbirths. Not comparable with Eurostat's
    PERIMORRT (demo_minfind), which is much lower: INFERENCE, its stillbirths are late
    foetal deaths of 28 weeks or more (Eurostat demo_mor metadata), ELSTAT's from 22.
  el:
    title: Περιγεννητική θνησιμότητα
    description: >-
      Οι γεννήσεις νεκρών και οι θάνατοι βρεφών ηλικίας έως και 6 ημερών μέσα στο έτος
      αναφοράς, ανά 1.000 συνολικές γεννήσεις (ζώντων και νεκρών) του ίδιου έτους, όπως
      την ορίζει η ΕΛΣΤΑΤ. Την επηρεάζει η διακοπή σειράς των γεννήσεων νεκρών το 2019.
      Δεν συγκρίνεται με τον δείκτη της Eurostat, που είναι πολύ χαμηλότερος: κατά πάσα
      πιθανότητα η Eurostat μετρά γεννήσεις νεκρών από τις 28 εβδομάδες κύησης, η ΕΛΣΤΑΤ
      από τις 22.

- id: neonatal_mortality_rate@v1
  metric: neonatal_mortality_rate
  unit: per 1000 live births
  title: Neonatal mortality rate
  description: >-
    Deaths of infants aged under 28 days during the reference year per 1000 live
    births of the same year, as ELSTAT defines it.
  el:
    title: Νεογνική θνησιμότητα
    description: >-
      Οι θάνατοι βρεφών ηλικίας κάτω των 28 ημερών μέσα στο έτος αναφοράς, ανά 1.000
      γεννήσεις ζώντων του ίδιου έτους, όπως την ορίζει η ΕΛΣΤΑΤ.

- id: live_births_normal_delivery@v1
  metric: live_births_normal_delivery
  unit: persons
  title: Live births by normal delivery
  description: >-
    Live births during the reference year by normal delivery, that is not by caesarean
    section, as ELSTAT records the method of birth (since 2018). Births whose method
    was not declared are counted neither here nor as caesarean.
  el:
    title: Γεννήσεις ζώντων με φυσιολογικό τοκετό
    description: >-
      Οι γεννήσεις ζώντων του έτους αναφοράς με φυσιολογικό τοκετό, δηλαδή όχι με
      καισαρική τομή, όπως καταγράφει η ΕΛΣΤΑΤ τη μέθοδο γέννησης (από το 2018). Οι
      γεννήσεις χωρίς δηλωμένη μέθοδο δεν μετρούν ούτε εδώ ούτε στις καισαρικές.

- id: live_births_caesarean@v1
  metric: live_births_caesarean
  unit: persons
  title: Live births by caesarean section
  description: >-
    Live births during the reference year by caesarean section, as ELSTAT records the
    method of birth (since 2018). Births whose method was not declared are counted
    neither here nor as normal deliveries.
  el:
    title: Γεννήσεις ζώντων με καισαρική τομή
    description: >-
      Οι γεννήσεις ζώντων του έτους αναφοράς με καισαρική τομή, όπως καταγράφει η
      ΕΛΣΤΑΤ τη μέθοδο γέννησης (από το 2018). Οι γεννήσεις χωρίς δηλωμένη μέθοδο δεν
      μετρούν ούτε εδώ ούτε στους φυσιολογικούς τοκετούς.

- id: marriages@v1
  metric: marriages
  unit: marriages
  title: Marriages
  description: >-
    Marriages that took place in Greece during the reference year, religious and civil.
    A couple married in both forms is counted once, by the first. Since 2024 (Law
    5089/2024) they include marriages between two men or two women. Civil partnerships
    are not marriages.
  el:
    title: Γάμοι
    description: >-
      Οι γάμοι που τελέστηκαν στην Ελλάδα μέσα στο έτος αναφοράς, θρησκευτικοί και
      πολιτικοί. Ζευγάρι που παντρεύτηκε και με τους δύο τύπους μετρά μία φορά, με τον
      γάμο που τελέστηκε πρώτος. Από το 2024 (Νόμος 5089/2024) περιλαμβάνουν και γάμους
      μεταξύ ανδρών ή μεταξύ γυναικών. Τα σύμφωνα συμβίωσης δεν είναι γάμοι.

- id: civil_marriages@v1
  metric: civil_marriages
  unit: marriages
  title: Civil marriages
  description: >-
    The civil marriages among the marriages of the reference year (see marriages@v1).
    Religious marriages are the rest.
  el:
    title: Πολιτικοί γάμοι
    description: >-
      Οι πολιτικοί γάμοι ανάμεσα στους γάμους του έτους αναφοράς (βλ. marriages@v1). Οι
      υπόλοιποι είναι θρησκευτικοί.

- id: civil_partnerships@v1
  metric: civil_partnerships
  unit: civil partnerships
  title: Civil partnerships
  description: >-
    Civil partnership agreements (σύμφωνα συμβίωσης) concluded in Greece during the
    reference year, between persons of different or of the same sex.
  el:
    title: Σύμφωνα συμβίωσης
    description: >-
      Τα σύμφωνα συμβίωσης που συνάφθηκαν στην Ελλάδα μέσα στο έτος αναφοράς, μεταξύ
      προσώπων διαφορετικού ή του ίδιου φύλου.

- id: first_marriages@v1
  metric: first_marriages
  unit: persons
  title: Spouses at their first marriage
  description: >-
    Persons who married for the first time during the reference year, by sex and age at
    the marriage. A marriage counts only its spouses not married before, so their
    number is not twice the number of marriages.
  el:
    title: Σύζυγοι κατά τον πρώτο γάμο
    description: >-
      Τα πρόσωπα που παντρεύτηκαν για πρώτη φορά μέσα στο έτος αναφοράς, κατά φύλο και
      ηλικία κατά τον γάμο. Κάθε γάμος μετρά μόνο όσους συζύγους δεν είχαν παντρευτεί
      ξανά, γι' αυτό ο αριθμός τους δεν είναι διπλάσιος των γάμων.

- id: divorces@v1
  metric: divorces
  unit: divorces
  title: Divorces
  description: >-
    Divorces issued during the reference year: consensual (by notarial deed) and
    contested (by final court ruling). Until 2017 ELSTAT collected divorces from the
    courts, since 2018 from the Ministry of the Interior: values from 2018 are not fully
    comparable with earlier ones.
  el:
    title: Διαζύγια
    description: >-
      Τα διαζύγια που εκδόθηκαν μέσα στο έτος αναφοράς: συναινετικά (με
      συμβολαιογραφική πράξη) και κατ' αντιδικία (με αμετάκλητη δικαστική απόφαση). Ως
      το 2017 η ΕΛΣΤΑΤ τα συνέλεγε από τα πρωτοδικεία, από το 2018 από το Υπουργείο
      Εσωτερικών: οι τιμές από το 2018 δεν συγκρίνονται πλήρως με τις προηγούμενες.

- id: divorces_per_100_marriages@v1
  metric: divorces_per_100_marriages
  unit: per 100 marriages
  title: Divorces per 100 marriages
  description: >-
    Divorces during the reference year per 100 marriages of the same year, as ELSTAT
    defines it. The divorces end marriages of many earlier years, so this is not the
    share of marriages that end in divorce.
  el:
    title: Διαζύγια ανά 100 γάμους
    description: >-
      Τα διαζύγια του έτους αναφοράς ανά 100 γάμους του ίδιου έτους, όπως την ορίζει η
      ΕΛΣΤΑΤ. Τα διαζύγια λύνουν γάμους πολλών προηγούμενων ετών, γι' αυτό η αναλογία
      δεν είναι το ποσοστό των γάμων που καταλήγουν σε διαζύγιο.

- id: divorced_persons@v1
  metric: divorced_persons
  unit: persons
  title: Divorced persons
  description: >-
    Persons divorced during the reference year, by sex and age at the divorce. Each
    divorce counts two persons; a divorce of two men or of two women counts two of the
    same sex.
  el:
    title: Διαζευγμένοι
    description: >-
      Τα πρόσωπα που πήραν διαζύγιο μέσα στο έτος αναφοράς, κατά φύλο και ηλικία κατά
      τη λύση του γάμου. Κάθε διαζύγιο μετρά δύο πρόσωπα· διαζύγιο δύο ανδρών ή δύο
      γυναικών μετρά δύο του ίδιου φύλου.

- id: births_change_women@v1
  metric: births_change_women
  unit: persons
  title: Change in live births from the number of women
  description: >-
    The part of the change in live births from the year before that comes from the
    number and age structure of women: for each mother's age, the change in the mean
    number of women of that age times the mean fertility rate of the two years. With
    births_change_fertility@v1 it adds up exactly to the change in births, at each age
    and in total. Rates are births by mother's age (Eurostat demo_fagec) per mean female
    population of 1 January of the year and the next (demo_pjan).
  el:
    title: Μεταβολή των γεννήσεων από τον αριθμό των γυναικών
    description: >-
      Το μέρος της μεταβολής των γεννήσεων ζώντων από το προηγούμενο έτος που οφείλεται
      στον αριθμό και την ηλικιακή δομή των γυναικών: για κάθε ηλικία της μητέρας, η
      μεταβολή του μέσου αριθμού γυναικών της ηλικίας επί τον μέσο δείκτη γονιμότητας
      των δύο ετών. Μαζί με τη μεταβολή από τη γονιμότητα αθροίζει ακριβώς στη μεταβολή
      των γεννήσεων, σε κάθε ηλικία και συνολικά.

- id: births_change_fertility@v1
  metric: births_change_fertility
  unit: persons
  title: Change in live births from fertility
  description: >-
    The part of the change in live births from the year before that comes from
    age-specific fertility: for each mother's age, the change in the fertility rate
    times the mean number of women of that age in the two years. With
    births_change_women@v1 it adds up exactly to the change in births.
  el:
    title: Μεταβολή των γεννήσεων από τη γονιμότητα
    description: >-
      Το μέρος της μεταβολής των γεννήσεων ζώντων από το προηγούμενο έτος που οφείλεται
      στη γονιμότητα κατά ηλικία: για κάθε ηλικία της μητέρας, η μεταβολή του δείκτη
      γονιμότητας επί τον μέσο αριθμό γυναικών της ηλικίας στα δύο έτη. Μαζί με τη
      μεταβολή από τον αριθμό των γυναικών αθροίζει ακριβώς στη μεταβολή των γεννήσεων.

- id: net_migration@v1
  metric: net_migration
  unit: persons
  title: Net migration plus statistical adjustment
  description: >-
    Total population change minus natural change during the reference year, as
    Eurostat demo_gind CNMIGRAT. It is a residual, not a count of migrants: it also
    absorbs statistical adjustments.
  el:
    title: Καθαρή μετανάστευση και στατιστική προσαρμογή
    description: >-
      Η συνολική μεταβολή του πληθυσμού μείον τη φυσική μεταβολή μέσα στο έτος.
      Είναι υπόλοιπο, όχι καταμέτρηση μεταναστών: περιέχει και τις στατιστικές
      προσαρμογές.

- id: fertility_rate@v1
  metric: fertility_rate
  unit: live births per woman
  title: Age-specific fertility rate
  description: >-
    Live births to women of the age (the age column) per woman of that age, as
    Eurostat demo_frate. Age is age in completed years; 10-14 and 50+ are open classes.
  el:
    title: Ειδικός κατά ηλικία δείκτης γονιμότητας
    description: >-
      Γεννήσεις ζώντων από γυναίκες μιας ηλικίας ανά γυναίκα αυτής της ηλικίας. Η
      ηλικία είναι σε συμπληρωμένα έτη· οι ομάδες 10–14 και 50+ είναι ανοιχτές.

- id: total_fertility_rate@v1
  metric: total_fertility_rate
  unit: live births per woman
  title: Total fertility rate
  description: >-
    Sum of the age-specific fertility rates of the reference year: the mean number of
    children a woman would have at those rates. As Eurostat demo_find TOTFERRT.
  el:
    title: Συνολικός δείκτης γονιμότητας
    description: >-
      Το άθροισμα των ειδικών κατά ηλικία δεικτών γονιμότητας ενός έτους: ο μέσος
      αριθμός παιδιών που θα αποκτούσε μια γυναίκα αν σε όλη την αναπαραγωγική της
      ζωή ίσχυαν οι δείκτες εκείνου του έτους.

- id: total_fertility_rate_order1@v1
  metric: total_fertility_rate_order1
  unit: live births per woman
  title: Total fertility rate, first births
  description: >-
    The part of the total fertility rate made of first births: each age-specific
    fertility rate (Eurostat demo_frate) times the share of first births among the
    births of known order at that age (demo_fordagec), summed over ages. The four orders
    add up to the total fertility rate.
  el:
    title: Συνολικός δείκτης γονιμότητας, πρώτο παιδί
    description: >-
      Το μέρος του συνολικού δείκτη γονιμότητας που αντιστοιχεί σε πρώτες γεννήσεις: κάθε
      ειδικός κατά ηλικία δείκτης γονιμότητας επί το μερίδιο αυτών των γεννήσεων στις
      γεννήσεις γνωστής σειράς της ηλικίας, αθροισμένο σε όλες τις ηλικίες. Οι τέσσερις
      σειρές αθροίζουν στον συνολικό δείκτη γονιμότητας.

- id: total_fertility_rate_order2@v1
  metric: total_fertility_rate_order2
  unit: live births per woman
  title: Total fertility rate, second births
  description: >-
    The part of the total fertility rate made of second births: each age-specific
    fertility rate (Eurostat demo_frate) times the share of second births among the
    births of known order at that age (demo_fordagec), summed over ages. The four orders
    add up to the total fertility rate.
  el:
    title: Συνολικός δείκτης γονιμότητας, δεύτερο παιδί
    description: >-
      Το μέρος του συνολικού δείκτη γονιμότητας που αντιστοιχεί σε δεύτερες γεννήσεις: κάθε
      ειδικός κατά ηλικία δείκτης γονιμότητας επί το μερίδιο αυτών των γεννήσεων στις
      γεννήσεις γνωστής σειράς της ηλικίας, αθροισμένο σε όλες τις ηλικίες. Οι τέσσερις
      σειρές αθροίζουν στον συνολικό δείκτη γονιμότητας.

- id: total_fertility_rate_order3@v1
  metric: total_fertility_rate_order3
  unit: live births per woman
  title: Total fertility rate, third births
  description: >-
    The part of the total fertility rate made of third births: each age-specific
    fertility rate (Eurostat demo_frate) times the share of third births among the
    births of known order at that age (demo_fordagec), summed over ages. The four orders
    add up to the total fertility rate.
  el:
    title: Συνολικός δείκτης γονιμότητας, τρίτο παιδί
    description: >-
      Το μέρος του συνολικού δείκτη γονιμότητας που αντιστοιχεί σε τρίτες γεννήσεις: κάθε
      ειδικός κατά ηλικία δείκτης γονιμότητας επί το μερίδιο αυτών των γεννήσεων στις
      γεννήσεις γνωστής σειράς της ηλικίας, αθροισμένο σε όλες τις ηλικίες. Οι τέσσερις
      σειρές αθροίζουν στον συνολικό δείκτη γονιμότητας.

- id: total_fertility_rate_order4plus@v1
  metric: total_fertility_rate_order4plus
  unit: live births per woman
  title: Total fertility rate, fourth and later births
  description: >-
    The part of the total fertility rate made of fourth and later births: each age-specific
    fertility rate (Eurostat demo_frate) times the share of fourth and later births among the
    births of known order at that age (demo_fordagec), summed over ages. The four orders
    add up to the total fertility rate.
  el:
    title: Συνολικός δείκτης γονιμότητας, τέταρτο και επόμενο παιδί
    description: >-
      Το μέρος του συνολικού δείκτη γονιμότητας που αντιστοιχεί σε τέταρτες και επόμενες γεννήσεις: κάθε
      ειδικός κατά ηλικία δείκτης γονιμότητας επί το μερίδιο αυτών των γεννήσεων στις
      γεννήσεις γνωστής σειράς της ηλικίας, αθροισμένο σε όλες τις ηλικίες. Οι τέσσερις
      σειρές αθροίζουν στον συνολικό δείκτη γονιμότητας.

- id: mean_age_first_birth@v1
  metric: mean_age_first_birth
  unit: years
  title: Mean age of women at birth of first child
  description: >-
    As Eurostat demo_find AGEMOTH1.
  el:
    title: Μέση ηλικία της μητέρας στην πρώτη γέννηση
    description: >-
      Η μέση ηλικία των γυναικών όταν γεννούν το πρώτο τους παιδί, όπως τη
      δημοσιεύει η Eurostat.

- id: mean_age_first_marriage@v1
  metric: mean_age_first_marriage
  unit: years
  title: Mean age at first marriage
  description: >-
    The mean age of women or men at their first marriage in the reference year, as
    Eurostat demo_nind FAGEMAR1 and MAGEMAR1 (the sex column).
  el:
    title: Μέση ηλικία στον πρώτο γάμο
    description: >-
      Η μέση ηλικία των γυναικών ή των ανδρών όταν παντρεύονται για πρώτη φορά, στο
      έτος αναφοράς, όπως τη δημοσιεύει η Eurostat.

- id: total_first_marriage_rate@v1
  metric: total_first_marriage_rate
  unit: first marriages per person
  title: Total first marriage rate
  description: >-
    The sum of the age-specific first marriage rates of the reference year, for women
    or men (the sex column): the share who would ever marry if those rates held for a
    whole life, as Eurostat demo_nind FMAR1CUM and MMAR1CUM.
  el:
    title: Συνολικός δείκτης πρώτων γάμων
    description: >-
      Το άθροισμα των ειδικών κατά ηλικία δεικτών πρώτων γάμων ενός έτους, για γυναίκες
      ή άνδρες: το μερίδιο που θα παντρευόταν κάποτε αν ίσχυαν σε όλη τη ζωή οι δείκτες
      εκείνου του έτους, όπως τον δημοσιεύει η Eurostat.

- id: age_leaving_parental_home@v1
  metric: age_leaving_parental_home
  unit: years
  title: Age of young people leaving the parental household
  description: >-
    Eurostat's estimate of the average age at which young people leave the parental
    household, from the Labour Force Survey (yth_demo_030): the age at which half no
    longer live with their parents. A survey estimate, with its breaks in series.
  el:
    title: Ηλικία αποχώρησης από το πατρικό σπίτι
    description: >-
      Η εκτίμηση της Eurostat για τη μέση ηλικία στην οποία οι νέοι φεύγουν από το
      πατρικό τους σπίτι, από την Έρευνα Εργατικού Δυναμικού: η ηλικία στην οποία οι
      μισοί δεν ζουν πια με τους γονείς τους. Εκτίμηση από δειγματοληπτική έρευνα.

- id: old_age_threshold@v1
  metric: old_age_threshold
  unit: years
  title: Old-age threshold
  description: >-
    The age at which remaining life expectancy is 15 years, for women or men (the sex
    column), from the period life table of the reference year (Eurostat demo_mlifetable),
    interpolated linearly between single ages. A threshold of old age that moves with
    longevity, instead of a fixed 65.
  el:
    title: Όριο γήρατος
    description: >-
      Η ηλικία στην οποία το υπόλοιπο προσδόκιμο ζωής είναι 15 έτη, για γυναίκες ή
      άνδρες, από τον πίνακα επιβίωσης του έτους αναφοράς. Ένα όριο γήρατος που
      μετακινείται μαζί με τη μακροζωία, αντί για τα σταθερά 65.

- id: prospective_old_age_dependency_ratio@v1
  metric: prospective_old_age_dependency_ratio
  unit: per 100 persons aged 20 to the old-age threshold
  title: Prospective old-age dependency ratio
  description: >-
    People older than the old-age threshold of their sex (old_age_threshold@v1) per 100
    people aged 20 to that threshold, on 1 January of the reference year (Eurostat
    demo_pjan). The old-age dependency ratio with a threshold that moves with longevity.
    Its thresholds reproduce published ones; the ratio itself does not reproduce the one
    published for 2013, which used a population of another vintage (INFERENCE).
  el:
    title: Δείκτης εξάρτησης ηλικιωμένων με κινητό όριο γήρατος
    description: >-
      Τα άτομα πάνω από το όριο γήρατος του φύλου τους ανά 100 άτομα από 20 ετών ως
      αυτό το όριο, την 1η Ιανουαρίου του έτους αναφοράς. Ο δείκτης εξάρτησης
      ηλικιωμένων με όριο γήρατος που ακολουθεί τη μακροζωία. Τα όριά του αναπαράγουν
      δημοσιευμένα· ο ίδιος ο δείκτης δεν αναπαράγει τον δημοσιευμένο για το 2013, που
      χρησιμοποίησε πληθυσμό άλλης έκδοσης (INFERENCE).

- id: projection_deviation_level@v1
  metric: projection_deviation_level
  unit: "% of the observed population"
  title: Deviation of a projected population from the observed one
  description: >-
    The baseline of an earlier Eurostat projection (EUROPOP2019, EUROPOP2023; the
    dataset_code says which) minus today's population on 1 January (demo_pjan), as a
    percentage of the latter. In the projection's base year it is the revision of the
    base population since the projection was made, not a deviation of the projection.
    A projection shows the consequences of its assumptions; it is not a forecast.
  el:
    title: Απόκλιση του προβαλλόμενου πληθυσμού από τον παρατηρούμενο
    description: >-
      Ο πληθυσμός μιας παλαιότερης προβολής της Eurostat (βασικό σενάριο) μείον τον
      σημερινό πληθυσμό της 1ης Ιανουαρίου, ως ποσοστό του δεύτερου. Στο έτος βάσης της
      προβολής είναι η αναθεώρηση του πληθυσμού βάσης μετά την προβολή, όχι απόκλιση
      της προβολής. Μια προβολή δείχνει τις συνέπειες των υποθέσεών της· δεν είναι
      πρόβλεψη.

- id: projection_deviation_change@v1
  metric: projection_deviation_change
  unit: "% of the observed population in the base year"
  title: Deviation of a projected population change from the observed one
  description: >-
    The change in population from the base year of an earlier Eurostat projection to
    the reference year as projected (baseline), minus the change observed today
    (demo_pjan), as a percentage of today's population in the base year. Unlike
    projection_deviation_level, it leaves out the revision of the base population.
  el:
    title: Απόκλιση της προβαλλόμενης μεταβολής του πληθυσμού από την παρατηρούμενη
    description: >-
      Η μεταβολή του πληθυσμού από το έτος βάσης μιας παλαιότερης προβολής της Eurostat
      ως το έτος αναφοράς κατά την προβολή (βασικό σενάριο), μείον τη σημερινή
      παρατηρούμενη μεταβολή, ως ποσοστό του σημερινού πληθυσμού του έτους βάσης. Σε
      αντίθεση με την απόκλιση του πληθυσμού, αφήνει έξω την αναθεώρηση του πληθυσμού
      βάσης.

- id: mean_age_childbearing@v1
  metric: mean_age_childbearing
  unit: years
  title: Mean age of women at childbirth
  description: >-
    Mean age of mothers at the birth of their children, of any birth order. As
    Eurostat demo_find AGEMOTH.
  el:
    title: Μέση ηλικία της μητέρας στη γέννηση
    description: >-
      Η μέση ηλικία των μητέρων στη γέννηση των παιδιών τους, οποιασδήποτε σειράς
      γέννησης.

- id: crude_birth_rate@v1
  metric: crude_birth_rate
  unit: per 1000 average population
  title: Crude birth rate
  description: >-
    Live births during the year per 1000 of the average population, as Eurostat
    demo_gind GBIRTHRT. It depends on the age structure: compare fertility between
    populations with the total fertility rate.
  el:
    title: Αδρός δείκτης γεννητικότητας
    description: >-
      Γεννήσεις ζώντων μέσα στο έτος ανά 1.000 κατοίκους του μέσου πληθυσμού.
      Εξαρτάται από την ηλικιακή δομή· τη γονιμότητα διαφορετικών πληθυσμών τη
      συγκρίνει ο συνολικός δείκτης γονιμότητας.

- id: crude_death_rate@v1
  metric: crude_death_rate
  unit: per 1000 average population
  title: Crude death rate
  description: >-
    Deaths during the year per 1000 of the average population, as Eurostat demo_gind
    GDEATHRT. It depends on the age structure: an older population has a higher rate
    at the same mortality. Compare mortality between populations with life
    expectancy.
  el:
    title: Αδρός δείκτης θνησιμότητας
    description: >-
      Θάνατοι μέσα στο έτος ανά 1.000 κατοίκους του μέσου πληθυσμού. Εξαρτάται από
      την ηλικιακή δομή: ένας γηραιότερος πληθυσμός έχει υψηλότερο δείκτη με την
      ίδια θνησιμότητα. Τη θνησιμότητα διαφορετικών πληθυσμών τη συγκρίνει το
      προσδόκιμο ζωής.

- id: crude_net_migration_rate@v1
  metric: crude_net_migration_rate
  unit: per 1000 average population
  title: Crude rate of net migration plus statistical adjustment
  description: >-
    Net migration plus statistical adjustment during the year per 1000 of the average
    population, as Eurostat demo_gind CNMIGRATRT. A residual, like net_migration@v1.
  el:
    title: Ρυθμός καθαρής μετανάστευσης και στατιστικής προσαρμογής
    description: >-
      Η καθαρή μετανάστευση και στατιστική προσαρμογή του έτους ανά 1.000 κατοίκους
      του μέσου πληθυσμού. Είναι υπόλοιπο, όπως η καθαρή μετανάστευση.

- id: sex_ratio@v1
  metric: sex_ratio
  unit: males per 100 females
  title: Sex ratio
  description: >-
    Males per 100 females on 1 January, all ages: 100 times the male population
    divided by the female population. Derived from the population by sex.
  el:
    title: Λόγος φύλων
    description: >-
      Άνδρες ανά 100 γυναίκες την 1η Ιανουαρίου, σε όλες τις ηλικίες: ο ανδρικός
      πληθυσμός διά τον γυναικείο, επί 100. Τον υπολογίζουμε από τον πληθυσμό κατά
      φύλο.

- id: life_expectancy@v1
  metric: life_expectancy
  unit: years
  title: Life expectancy
  description: >-
    Mean number of further years a person of the exact age (the age column; 0 is at
    birth) would live at the mortality rates of the reference year, as Eurostat
    demo_mlexpec.
  el:
    title: Προσδόκιμο ζωής
    description: >-
      Ο μέσος αριθμός ετών που θα ζούσε ακόμη ένα άτομο μιας ακριβούς ηλικίας (0
      σημαίνει στη γέννηση), αν σε όλη την υπόλοιπη ζωή του ίσχυαν τα ποσοστά
      θνησιμότητας κατά ηλικία του έτους αναφοράς.

- id: infant_mortality_rate@v1
  metric: infant_mortality_rate
  unit: per 1000 live births
  title: Infant mortality rate
  description: >-
    Deaths of children under one year of age per 1000 live births in the reference
    year (Eurostat demo_minfind INFMORRT; ELSTAT natural movement of population).
  el:
    title: Βρεφική θνησιμότητα
    description: >-
      Θάνατοι παιδιών κάτω του ενός έτους ανά 1.000 γεννήσεις ζώντων του έτους
      αναφοράς.

- id: age_specific_death_rate@v1
  metric: age_specific_death_rate
  unit: deaths per person-year
  title: Age-specific death rate
  description: >-
    Deaths at the age (the age column, in completed years; 95+ is the open class) per
    person-year lived at that age in the reference year: the central death rate m(x)
    of the Eurostat life table, as Eurostat demo_mlifetable DEATHRATE.
  el:
    title: Ειδικός κατά ηλικία δείκτης θνησιμότητας
    description: >-
      Θάνατοι σε μια ηλικία (σε συμπληρωμένα έτη· η ομάδα 95+ είναι ανοιχτή) ανά
      ανθρωποέτος που έζησαν τα άτομα αυτής της ηλικίας μέσα στο έτος αναφοράς: ο
      κεντρικός δείκτης θνησιμότητας του πίνακα επιβίωσης της Eurostat.

- id: probability_of_dying@v1
  metric: probability_of_dying
  unit: probability
  title: Probability of dying between exact ages
  description: >-
    Probability that a person who reaches the exact age x (the age column) dies before
    x+1, at the mortality rates of the reference year; 1 for the open class 95+. q(x)
    of the Eurostat life table, as Eurostat demo_mlifetable PROBDEATH.
  el:
    title: Πιθανότητα θανάτου πριν από την επόμενη ηλικία
    description: >-
      Η πιθανότητα ένα άτομο που φτάνει την ακριβή ηλικία x να πεθάνει πριν από την
      ηλικία x+1, με τα ποσοστά θνησιμότητας του έτους αναφοράς· για την ανοιχτή ομάδα
      95+ είναι ίση με ένα. Η στήλη q(x) του πίνακα επιβίωσης της Eurostat.
