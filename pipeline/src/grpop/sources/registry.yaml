# Source registry (Phase 0).
#
# Every dataset the project uses is listed here before any code depends on it.
# verification.status changes to "verified" only after a probe report
# (grpop-probe, run in GitHub Actions) has been read and the evidence recorded.
# Dataset codes marked "candidate" in notes are expected codes that have not yet
# been confirmed against the live catalogue.

- id: eurostat_demo_pjan
  provider: Eurostat
  dataset_code: demo_pjan
  title: Population on 1 January by age and sex
  access: api
  probe_kind: eurostat_jsonstat
  probe_url: https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/demo_pjan?format=JSON&lang=EN&geo=EL&sex=T&age=TOTAL&lastTimePeriod=1
  licence: to_verify
  used_for: [population_1jan, age_structure, pyramids, dependency_ratios]
  phase: 1
  verification: {status: verified, checked_at: 2026-09-28, evidence: 'Source probe run 36432199610: HTTP 200, JSON-stat with Greek values; confirms the code exists'}

