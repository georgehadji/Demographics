# Source registry.
#
# Every dataset the project uses is listed here before any code depends on it.
# verification.status changes to "verified" only after a probe report
# (grpop-probe, run in GitHub Actions) has been read and the evidence recorded.
# Dataset codes marked "candidate" in notes are expected codes that have not yet
# been confirmed against the live catalogue.
#
# Single source of truth for source metadata and reuse terms. Each licence is
# defined once under `licences` and referenced by key from `sources`; in an
# attribution, {dataset_code} is filled in from the source entry.

licences:
  eurostat:
    name: CC BY 4.0 (Eurostat copyright notice; Commission Decision 2011/833/EU)
    terms_url: https://ec.europa.eu/eurostat/help/copyright-notice
    attribution: 'Source: Eurostat, dataset {dataset_code}'
    commercial_reuse: true
    checked_at: 2026-09-28
    notes: >-
      Reuse allowed if the source is acknowledged and changes are indicated. Data
      for countries outside the EU and EFTA (e.g. the USA, Japan) is for
      non-commercial reuse only: check before adding non-European peers.
  gisco_geodata:
    name: Eurostat/GISCO geodata terms (non-commercial)
    terms_url: https://ec.europa.eu/eurostat/web/gisco/geodata/statistical-units
    attribution: © EuroGeographics for the administrative boundaries
    commercial_reuse: false
    checked_at: 2026-09-28
    notes: >-
      Non-exclusive, non-transferable right to use and process, on condition the
      data is not used commercially and the source is acknowledged. The notice
      must be visible on every map. Boundary geometry therefore cannot be
      released under CC BY 4.0 (see LICENSE-CONTENT.md).
  elstat:
    name: ELSTAT copyright and reuse policy
    terms_url: https://www.statistics.gr/documents/20181/1412250/Copyright_Reuse_Policy_EN.pdf/dfacb7d1-3d9b-471f-851a-8b8b09994a74
    attribution: 'Source: ELSTAT (Hellenic Statistical Authority), www.statistics.gr'
    commercial_reuse: true
    checked_at: 2026-09-28
    notes: >-
      Free reuse, commercial and non-commercial, without payment or written
      licence, provided the source is indicated. Any modification (including
      translation) must be stated to the end user together with a statement that
      ELSTAT bears no responsibility for the result. Third-party material is excluded.
  un_wpp:
    name: CC BY 3.0 IGO
    terms_url: https://creativecommons.org/licenses/by/3.0/igo/
    attribution: 'United Nations, Department of Economic and Social Affairs, Population Division (2024). World Population Prospects 2024.'
    commercial_reuse: true
    checked_at: 2026-09-28
    notes: >-
      VERIFIED for figures and tables of the WPP 2024 Summary of Results (copyright
      page). That the data files carry the same licence is an INFERENCE; confirm on
      the download page when ingestion starts.
  hmd:
    name: CC BY 4.0
    terms_url: https://www.mortality.org/Data/UserAgreement
    attribution: 'HMD. Human Mortality Database. Max Planck Institute for Demographic Research (Germany), University of California, Berkeley (USA), and French Institute for Demographic Studies (France). Available at www.mortality.org.'
    commercial_reuse: true
    checked_at: 2026-09-28
    notes: >-
      CC BY 4.0 covers HMD estimates. "Input Data" must not be re-published in any
      form without the data owners' permission. HMD asks users to point others to
      its website rather than share copies.
  hfd:
    name: CC BY 4.0
    terms_url: https://www.humanfertility.org/Data/UserAgreement
    attribution: 'HFD. Human Fertility Database. Max Planck Institute for Demographic Research (Germany) and Vienna Institute of Demography (Austria). Available at www.humanfertility.org. Data downloaded on [date].'
    commercial_reuse: true
    checked_at: 2026-09-28
    notes: >-
      Input data must not be re-published commercially without the owners'
      permission. HFD prefers that users are referred to its website rather than
      given copies of the data.

