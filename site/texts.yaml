# Explanatory text of the generated pages (src/pages.js), in Greek Markdown: what each
# page and each indicator shows and how to read it. Prose only: never a value of the
# data (test/pages.test.js rejects decimals and years); values come from fact() and
# chart(). The formal definition of each indicator is in definitions.yaml (`el`).

pages:
  home: |
    Οι Κοόρτες είναι ένα ανοιχτό παρατηρητήριο για τη δημογραφία της Ελλάδας. Δείχνουν
    πόσοι είμαστε, πώς αλλάζει ο πληθυσμός και γιατί: πόσα παιδιά γεννιούνται, πόσο
    ζούμε, πόσοι έρχονται και πόσοι φεύγουν, πώς αλλάζει η ηλικιακή σύνθεση της χώρας
    και των Περιφερειών της, και τι συνεπάγονται οι επίσημες προβολές για το μέλλον.

    Κάθε αριθμός διαβάζεται από τα επίσημα δεδομένα (Eurostat, ΕΛΣΤΑΤ, ΟΗΕ) τη στιγμή
    που χτίζεται η σελίδα, μαζί με την πηγή, την έκδοση και τον ορισμό του. Κανένας
    αριθμός δεν γράφεται με το χέρι. Κάτω από κάθε γράφημα υπάρχουν ο πίνακας με τα
    δεδομένα, λήψη σε CSV και η πηγή.

    ## Το δημογραφικό ισοζύγιο

    Ο πληθυσμός μιας χώρας αλλάζει με δύο τρόπους. Η **φυσική μεταβολή** είναι οι
    γεννήσεις μείον τους θανάτους. Η **καθαρή μετανάστευση** είναι όσοι ήρθαν να ζήσουν
    στη χώρα μείον όσους έφυγαν. Το άθροισμά τους είναι η συνολική μεταβολή του
    πληθυσμού μέσα στο έτος. Οι τιμές παρακάτω είναι οι πιο πρόσφατες για την Ελλάδα.
  home_after: |
    Η καθαρή μετανάστευση είναι **εκτίμηση** της Eurostat, όχι μέτρηση: υπολογίζεται ως
    υπόλοιπο, η συνολική μεταβολή μείον τη φυσική, και περιέχει και τις στατιστικές
    διορθώσεις.

    ## Τι θα βρείτε εδώ

    - **[Δείκτες](indicators/index.qmd):** κάθε δείκτης στη σελίδα του, με την Ελλάδα
      απέναντι στην Ευρωπαϊκή Ένωση, εξήγηση του τι μετρά και, όπου υπάρχουν δεδομένα,
      χάρτη των Περιφερειών.
    - **[Περιφέρειες](regions/index.qmd):** κάθε Περιφέρεια απέναντι στο σύνολο της
      χώρας.
    - **[Προβολές](projections.qmd):** οι προβολές πληθυσμού της Eurostat και του ΟΗΕ.
    - **[Ορισμοί](definitions.qmd)** και **[Πηγές](sources.qmd):** τι ακριβώς μετρά ο
      κάθε δείκτης και από πού έρχονται τα δεδομένα.

  indicators: |
    Κάθε δείκτης έχει δική του σελίδα. Σε όλες η σειρά είναι η ίδια: η πιο πρόσφατη
    τιμή για την Ελλάδα και τις συγκρίσεις, το γράφημα της χρονοσειράς, εξήγηση του τι
    δείχνει ο δείκτης και πώς διαβάζεται, ο ορισμός του και, όπου η Eurostat δημοσιεύει
    περιφερειακά στοιχεία, οι Περιφέρειες.

    Η Ελλάδα συγκρίνεται με δύο μεγέθη της Ευρωπαϊκής Ένωσης. Η **ΕΕ-27** είναι η τιμή
    της Eurostat για το σύνολο των είκοσι επτά χωρών, σαν να ήταν μία χώρα: οι μεγάλες
    χώρες βαραίνουν περισσότερο. Ο **διάμεσος ΕΕ-27** είναι η μεσαία χώρα όταν τις
    κατατάξουμε: οι μισές χώρες έχουν υψηλότερη τιμή και οι μισές χαμηλότερη, όποιο κι
    αν είναι το μέγεθός τους. Τον υπολογίζουμε εμείς, μόνο για τα έτη στα οποία έχουν
    τιμή και οι είκοσι επτά χώρες.

  chart: |
    - Η **Ελλάδα** έχει το χρώμα έμφασης· οι συγκρίσεις είναι σε ουδέτερο γκρι. Το όνομα
      κάθε σειράς είναι γραμμένο πάνω στη γραμμή.
    - **Συνεχής γραμμή:** επίσημη τιμή ή δείκτης που υπολογίσαμε από επίσημα δεδομένα.
      **Διακεκομμένη γραμμή με ζώνες:** προβολή. **Διάστικτη γραμμή σε άλλη απόχρωση:**
      σενάριο.
    - **Κούφιο σημάδι:** προσωρινή τιμή, που μπορεί να αναθεωρηθεί.
    - **Αστερίσκος:** διακοπή σειράς. Η πηγή άλλαξε μέθοδο ή κάλυψη εκείνο το έτος, και
      οι τιμές πριν και μετά δεν συγκρίνονται απόλυτα. Η γραμμή της Ελλάδας διακόπτεται
      εκεί.
    - Αν περάσετε τον δείκτη του ποντικιού πάνω από ένα σημείο, βλέπετε την τιμή, την
      περίοδο, τη φύση και την κατάσταση της τιμής. Τα ίδια υπάρχουν στον **πίνακα
      δεδομένων**, που ανοίγει και με το πληκτρολόγιο. Η **πηγή και ο ορισμός** κάθε
      σειράς είναι στο πάνελ κάτω από το γράφημα.

  regional: |
    Οι Περιφέρειες εδώ είναι οι περιοχές NUTS 2 της Eurostat. Τα στοιχεία είναι από
    τους περιφερειακούς πίνακες της Eurostat, που συχνά δημοσιεύονται αργότερα από τους
    εθνικούς.

    - Ένας **ρυθμός ή δείκτης** δείχνεται σε χάρτη, με χρώματα ανά κλάση τιμών (οι
      κλάσεις γράφονται στο υπόμνημα), και σε πλέγμα: κάθε Περιφέρεια είναι ένα τετράγωνο
      του ίδιου μεγέθους με τη δική της χρονοσειρά, ώστε οι μικρές Περιφέρειες να
      φαίνονται όσο και οι μεγάλες.
    - Ένα **πλήθος** (άτομα) δείχνεται με κύκλους: το εμβαδόν κάθε κύκλου είναι ανάλογο
      της τιμής. Ένας χάρτης με χρώματα θα έκανε τις μεγάλες σε έκταση Περιφέρειες να
      φαίνονται σημαντικότερες.

    Σε Περιφέρειες με μικρό πληθυσμό λίγα γεγονότα αλλάζουν πολύ έναν δείκτη, άρα οι
    διαφορές από έτος σε έτος διαβάζονται με προσοχή.

  regions: |
    Η Ελλάδα χωρίζεται σε Περιφέρειες, που στην ευρωπαϊκή στατιστική είναι οι περιοχές
    του επιπέδου NUTS 2. Η σελίδα κάθε Περιφέρειας δείχνει τους δείκτες για τους οποίους
    η Eurostat δημοσιεύει περιφερειακά στοιχεία, με την Περιφέρεια απέναντι στο σύνολο
    της χώρας. Τα ονόματα και τα όρια είναι της υπηρεσίας γεωγραφικών δεδομένων της
    Eurostat (GISCO).

    Τα περιφερειακά στοιχεία βγαίνουν συχνά με καθυστέρηση έναντι των εθνικών, οπότε το
    πιο πρόσφατο έτος μπορεί να διαφέρει από αυτό των σελίδων των δεικτών.

  region: |
    Οι δείκτες της Περιφέρειας για τους οποίους η Eurostat δημοσιεύει περιφερειακά
    στοιχεία. Οι ρυθμοί και οι δείκτες συγκρίνονται με το σύνολο της χώρας. Τα πλήθη
    (άτομα) δείχνονται μόνα τους, γιατί δίπλα στα μεγέθη της χώρας η γραμμή της
    Περιφέρειας θα έμενε επίπεδη στο κάτω μέρος. Η εξήγηση κάθε δείκτη είναι στη σελίδα
    του, μέσω του συνδέσμου «Όλες οι χώρες».

  projections: |
    Μια προβολή πληθυσμού υπολογίζει πώς θα εξελιχθεί ο πληθυσμός αν η γονιμότητα, η
    θνησιμότητα και η μετανάστευση ακολουθήσουν συγκεκριμένες υποθέσεις. Είναι
    μαθηματική συνέπεια αυτών των υποθέσεων, **όχι πρόβλεψη**: αν οι υποθέσεις δεν
    επαληθευτούν, ούτε η προβολή θα επαληθευτεί. Οι προβολές είναι χρήσιμες γιατί
    δείχνουν πόσο από το μέλλον είναι ήδη γραμμένο στη σημερινή ηλικιακή σύνθεση: τα
    παιδιά που δεν γεννιούνται σήμερα δεν θα γίνουν γονείς σε τριάντα χρόνια.

    Εδώ υπάρχουν δύο επίσημες προβολές, με διαφορετική λογική.
  projections_europop: |
    Η Eurostat δημοσιεύει μια **βασική προβολή** και **σενάρια**. Κάθε σενάριο αλλάζει
    μία υπόθεση της βασικής, για παράδειγμα χαμηλότερη γονιμότητα ή καθόλου μετανάστευση,
    και αφήνει τις υπόλοιπες ίδιες. Η απόσταση ενός σεναρίου από τη βασική προβολή
    δείχνει πόσο ευαίσθητο είναι το αποτέλεσμα σε αυτή την υπόθεση. Τα σενάρια δεν είναι
    προβλέψεις ούτε αποτελέσματα πολιτικών.
  projections_wpp: |
    Ο ΟΗΕ δίνει μια **πιθανοτική προβολή**: αντί για σενάρια, υπολογίζει πολλές πιθανές
    πορείες της γονιμότητας και της διάρκειας ζωής και δημοσιεύει τον διάμεσο και τα
    διαστήματα που περιέχουν το 80% και το 95% αυτών των πορειών. Οι ζώνες δείχνουν την
    αβεβαιότητα μέσα στο μοντέλο του ΟΗΕ, όχι κάθε πιθανή έκβαση.

  mortality: |
    Πόσο πιθανό είναι να πεθάνει κανείς σε κάθε ηλικία, και πώς άλλαξε αυτό με τα
    χρόνια. Τα στοιχεία είναι από τον πίνακα επιβίωσης της Eurostat για την Ελλάδα, με
    άνδρες και γυναίκες μαζί. Ο πίνακας επιβίωσης είναι η βάση του
    [προσδόκιμου ζωής](life_expectancy_0.qmd): το προσδόκιμο συνοψίζει σε έναν αριθμό
    αυτό που εδώ φαίνεται ηλικία προς ηλικία.

    Οι τιμές παρακάτω είναι η πιθανότητα ένα άτομο που μόλις έκλεισε την ηλικία αυτή να
    πεθάνει πριν από τα επόμενα γενέθλιά του, με τα ποσοστά θνησιμότητας του πιο
    πρόσφατου έτους.
  mortality_after: |
    ## Πώς διαβάζεται το διάγραμμα Lexis

    - Κάθε **στήλη** είναι ένα ημερολογιακό έτος και κάθε **γραμμή** μια ηλικία· κάθε
      κελί είναι ο ειδικός δείκτης θνησιμότητας εκείνης της ηλικίας εκείνο το έτος.
    - Το **χρώμα** δείχνει την κλάση της τιμής· το υπόμνημα πάνω από το διάγραμμα λέει
      ποιο χρώμα αντιστοιχεί σε ποιες τιμές. Οι κλάσεις είναι ποσοστημόρια, δηλαδή κάθε κλάση έχει τον ίδιο αριθμό
      κελιών· αλλιώς, επειδή η θνησιμότητα στα γηρατειά είναι πολλές φορές μεγαλύτερη από
      ό,τι στη νεότητα, σχεδόν όλο το διάγραμμα θα είχε ένα χρώμα.
    - Οι **λεπτές διαγώνιες** ακολουθούν γενιές: όσους γεννήθηκαν το ίδιο έτος, κάθε δέκα
      χρόνια. Μια γενιά μεγαλώνει ένα χρόνο κάθε χρόνο, άρα κινείται διαγώνια.
    - Με το ποντίκι πάνω σε ένα κελί βλέπετε την τιμή, την ηλικία και το έτος· τα ίδια
      υπάρχουν στον πίνακα δεδομένων κάτω από το διάγραμμα.

    ## Τι δείχνει

    Η θνησιμότητα είναι υψηλή στον πρώτο χρόνο της ζωής, πέφτει στο χαμηλότερο σημείο
    της στην παιδική ηλικία και μετά ανεβαίνει σχεδόν σταθερά με την ηλικία. Οριζόντιες
    αλλαγές χρώματος από αριστερά προς τα δεξιά δείχνουν πώς άλλαξε η θνησιμότητα σε μια
    ηλικία με τα χρόνια· κάθετες λωρίδες δείχνουν χρονιές με ασυνήθιστα πολλούς θανάτους
    σε όλες τις ηλικίες.

    ## Τι να προσέχετε

    - Οι τιμές είναι του **έτους**, όχι μιας γενιάς: δεν λένε τι θα ζήσει όποιος έχει
      σήμερα αυτή την ηλικία, αλλά τι συνέβη στις ηλικίες αυτές εκείνο το έτος.
    - Στις πολύ μεγάλες ηλικίες οι πληθυσμοί είναι μικροί και οι τιμές πιο ασταθείς. Η
      ανοιχτή ομάδα στο τέλος του πίνακα (για παράδειγμα 95+) δεν εμφανίζεται στο
      διάγραμμα, γιατί δεν είναι ένα έτος ηλικίας.
    - Τα παλαιότερα έτη ο πίνακας κλείνει σε χαμηλότερη ηλικία· τα κελιά πάνω από αυτήν
      μένουν κενά.
    - Ο δείκτης θνησιμότητας και η πιθανότητα θανάτου διαφέρουν λίγο: ο πρώτος μετρά
      θανάτους ανά ανθρωποέτος ζωής στην ηλικία, η δεύτερη την πιθανότητα για όποιον
      φτάνει στην ηλικία. Σε χαμηλές τιμές σχεδόν ταυτίζονται.

  definitions: |
    Ο ακριβής ορισμός κάθε μεγέθους που δείχνει το site: τι μετρά, σε ποια μονάδα και
    για ποια ημερομηνία. Ο κωδικός κάτω από κάθε τίτλο (για παράδειγμα
    `population_1jan@v1`) είναι αυτός που φέρει κάθε τιμή στα δεδομένα και στα πάνελ
    πηγής. Αν αλλάξει ο ορισμός ενός μεγέθους, αλλάζει η έκδοση του κωδικού, ώστε οι
    παλιές τιμές να κρατούν τη σημασία τους. Οι ορισμοί διαβάζονται από το αρχείο του
    κώδικα ([`definitions.yaml`]({definitions})).

  sources: |
    Τα δεδομένα από τα οποία χτίζεται το site, με την άδεια χρήσης και την αναφορά που
    ζητά κάθε πάροχος. Όλες οι πηγές είναι επίσημες στατιστικές υπηρεσίες ή διεθνείς
    οργανισμοί. Κάθε λήψη αποθηκεύεται αμετάβλητη, ώστε κάθε αριθμός να μπορεί να
    ξαναϋπολογιστεί από τα ίδια αρχεία. Ο πλήρης κατάλογος, με την επαλήθευση κάθε πηγής,
    είναι στο αρχείο του κώδικα ([`registry.yaml`]({registry})). Η αναφορά κάθε πηγής
    παρατίθεται όπως τη ζητά ο πάροχος, στη γλώσσα του.

indicators:
  population: |
    ## Τι δείχνει

    Πόσοι άνθρωποι ζουν μόνιμα στην Ελλάδα την 1η Ιανουαρίου κάθε έτους. Μόνιμος
    πληθυσμός είναι όσοι έχουν τη συνήθη διαμονή τους στη χώρα, ανεξάρτητα από την
    υπηκοότητα. Δεν μετρά όσους βρίσκονται προσωρινά στη χώρα, όπως οι τουρίστες.

    ## Πώς διαβάζεται

    Η κλίση της γραμμής δείχνει αν ο πληθυσμός αυξάνεται ή μειώνεται. Το γιατί φαίνεται
    στους δύο δείκτες που τον αλλάζουν: τη [φυσική μεταβολή](natural_change.qmd)
    (γεννήσεις μείον θάνατοι) και την [καθαρή μετανάστευση](net_migration.qmd).

    ## Τι να προσέχετε

    Ανάμεσα στις απογραφές ο πληθυσμός εκτιμάται από τις γεννήσεις, τους θανάτους και
    τη μετανάστευση. Μετά από κάθε απογραφή οι εκτιμήσεις διορθώνονται, και η διόρθωση
    μπορεί να φανεί ως διακοπή σειράς. Οι απόλυτοι αριθμοί δεν συγκρίνονται άμεσα μεταξύ
    χωρών διαφορετικού μεγέθους· για σύγκριση χρησιμοποιείται ο
    [ρυθμός μεταβολής](population_growth_rate.qmd).

  natural_change: |
    ## Τι δείχνει

    Τη διαφορά ανάμεσα στις γεννήσεις ζώντων και στους θανάτους μέσα στο έτος. Θετική
    τιμή σημαίνει ότι γεννήθηκαν περισσότεροι από όσους πέθαναν· αρνητική, το αντίθετο.

    ## Πώς διαβάζεται

    Η φυσική μεταβολή εξαρτάται από δύο πράγματα: πόσα παιδιά κάνει κάθε γυναίκα (τη
    [γονιμότητα](total_fertility_rate.qmd)) και πόσοι άνθρωποι βρίσκονται σε κάθε ηλικία.
    Ένας γηρασμένος πληθυσμός έχει περισσότερους θανάτους και λιγότερες γυναίκες σε
    ηλικία να κάνουν παιδιά. Γι' αυτό η φυσική μεταβολή μπορεί να μένει αρνητική για
    χρόνια, ακόμη κι αν η γονιμότητα ανέβει λίγο.

    ## Τι να προσέχετε

    Είναι απόλυτος αριθμός ατόμων. Για σύγκριση με χώρες άλλου μεγέθους χρησιμοποιούνται
    ο [αδρός δείκτης γεννητικότητας](crude_birth_rate.qmd) και ο
    [αδρός δείκτης θνησιμότητας](crude_death_rate.qmd).

  net_migration: |
    ## Τι δείχνει

    Πόσο άλλαξε ο πληθυσμός μέσα στο έτος για λόγους εκτός από τις γεννήσεις και τους
    θανάτους: χοντρικά, όσοι ήρθαν να ζήσουν στη χώρα μείον όσους έφυγαν. Θετική τιμή
    σημαίνει περισσότερες αφίξεις από αναχωρήσεις.

    ## Πώς διαβάζεται

    Η Eurostat δεν μετρά αυτό το μέγεθος απευθείας. Το υπολογίζει ως **υπόλοιπο**: τη
    συνολική μεταβολή του πληθυσμού μείον τη φυσική μεταβολή. Γι' αυτό περιέχει και τις
    στατιστικές διορθώσεις του πληθυσμού, όχι μόνο τη μετανάστευση. Είναι **εκτίμηση**,
    όχι καταμέτρηση ανθρώπων.

    ## Τι να προσέχετε

    Είναι **ροή** μέσα στο έτος, όχι **απόθεμα**: δεν λέει πόσοι μετανάστες ζουν στη
    χώρα. Δεν διακρίνει επίσης Έλληνες πολίτες από αλλοδαπούς ούτε όσους γεννήθηκαν στη
    χώρα από όσους γεννήθηκαν αλλού: μια αναχώρηση Ελλήνων προς το εξωτερικό μειώνει την
    καθαρή μετανάστευση όπως και μια αναχώρηση αλλοδαπών. Για σύγκριση με χώρες άλλου
    μεγέθους χρησιμοποιείται ο [ρυθμός καθαρής μετανάστευσης](crude_net_migration_rate.qmd).

  population_growth_rate: |
    ## Τι δείχνει

    Πόσο άλλαξε ο πληθυσμός μέσα στο έτος, ανά χίλιους κατοίκους. Θετική τιμή σημαίνει
    αύξηση, αρνητική μείωση.

    ## Πώς διαβάζεται

    Επειδή είναι ανά χίλιους κατοίκους, συγκρίνει χώρες και Περιφέρειες κάθε μεγέθους.
    Ισούται με τον [αδρό δείκτη γεννητικότητας](crude_birth_rate.qmd) μείον τον
    [αδρό δείκτη θνησιμότητας](crude_death_rate.qmd) συν τον
    [ρυθμό καθαρής μετανάστευσης](crude_net_migration_rate.qmd), οπότε δείχνει ποιο από
    τα τρία κινεί τη μεταβολή.

    ## Τι να προσέχετε

    Ο παρονομαστής είναι ο μέσος πληθυσμός του έτους. Περιέχει την καθαρή μετανάστευση,
    άρα και τις στατιστικές διορθώσεις της.

  crude_birth_rate: |
    ## Τι δείχνει

    Πόσα παιδιά γεννήθηκαν ζωντανά μέσα στο έτος, ανά χίλιους κατοίκους.

    ## Πώς διαβάζεται

    Δείχνει πόσο συνεισφέρουν οι γεννήσεις στη μεταβολή του πληθυσμού. Μαζί με τον
    [αδρό δείκτη θνησιμότητας](crude_death_rate.qmd) δίνει τη φυσική μεταβολή ανά χίλιους
    κατοίκους.

    ## Τι να προσέχετε

    Ο αδρός δείκτης εξαρτάται από την ηλικιακή δομή: ένας πληθυσμός με λιγότερες γυναίκες
    σε αναπαραγωγική ηλικία έχει χαμηλότερο δείκτη με την ίδια γονιμότητα. Για να
    συγκρίνετε τη γονιμότητα μεταξύ χωρών ή Περιφερειών, ή στην ίδια χώρα σε μεγάλο
    χρονικό διάστημα, χρησιμοποιήστε τον
    [συνολικό δείκτη γονιμότητας](total_fertility_rate.qmd).

  crude_death_rate: |
    ## Τι δείχνει

    Πόσοι πέθαναν μέσα στο έτος, ανά χίλιους κατοίκους.

    ## Πώς διαβάζεται

    Δείχνει πόσο αφαιρούν οι θάνατοι από τον πληθυσμό. Μαζί με τον
    [αδρό δείκτη γεννητικότητας](crude_birth_rate.qmd) δίνει τη φυσική μεταβολή ανά
    χίλιους κατοίκους.

    ## Τι να προσέχετε

    Ο αδρός δείκτης εξαρτάται από την ηλικιακή δομή: ένας γηραιότερος πληθυσμός έχει
    υψηλότερο δείκτη ακόμη κι αν σε κάθε ηλικία πεθαίνουν λιγότεροι. Έτσι ο δείκτης
    μπορεί να ανεβαίνει ενώ η διάρκεια ζωής αυξάνεται. Για να συγκρίνετε τη θνησιμότητα
    μεταξύ χωρών ή Περιφερειών, χρησιμοποιήστε το
    [προσδόκιμο ζωής](life_expectancy_0.qmd).

  crude_net_migration_rate: |
    ## Τι δείχνει

    Την [καθαρή μετανάστευση](net_migration.qmd) του έτους ανά χίλιους κατοίκους: πόσο
    άλλαξε ο πληθυσμός για λόγους εκτός από τις γεννήσεις και τους θανάτους, σε σχέση με
    το μέγεθός του.

    ## Πώς διαβάζεται

    Επειδή είναι ανά χίλιους κατοίκους, συγκρίνει χώρες και Περιφέρειες κάθε μεγέθους.
    Θετική τιμή σημαίνει ότι ο πληθυσμός κερδίζει από τη μετανάστευση· αρνητική ότι
    χάνει.

    ## Τι να προσέχετε

    Όπως και η καθαρή μετανάστευση, είναι **εκτίμηση** και **υπόλοιπο**: περιέχει τις
    στατιστικές διορθώσεις του πληθυσμού. Είναι ροή μέσα στο έτος, όχι αριθμός μεταναστών
    που ζουν στη χώρα, και δεν διακρίνει πολίτες από αλλοδαπούς.

  total_fertility_rate: |
    ## Τι δείχνει

    Πόσα παιδιά θα έκανε κατά μέσο όρο μια γυναίκα, αν σε όλη την αναπαραγωγική της
    ζωή ίσχυαν τα ποσοστά γεννήσεων κατά ηλικία ενός συγκεκριμένου έτους. Είναι ο πιο
    διαδεδομένος δείκτης γονιμότητας.

    ## Πώς διαβάζεται

    Δεν εξαρτάται από την ηλικιακή δομή, άρα συγκρίνει χώρες, Περιφέρειες και έτη. Το
    **επίπεδο αναπλήρωσης των γενεών** είναι λίγο πάνω από δύο παιδιά ανά γυναίκα στις
    χώρες με χαμηλή θνησιμότητα: τόσα χρειάζονται ώστε κάθε γενιά να αντικαθιστά την
    προηγούμενη χωρίς μετανάστευση. Γονιμότητα κάτω από αυτό το επίπεδο για πολλά χρόνια
    σημαίνει ότι κάθε γενιά είναι μικρότερη από την προηγούμενη.

    ## Τι να προσέχετε

    Είναι μέγεθος **ενός έτους**, όχι ο αριθμός παιδιών που έκανε πράγματι κάποια γενιά
    γυναικών. Όταν οι γυναίκες αναβάλλουν τις γεννήσεις σε μεγαλύτερη ηλικία, ο δείκτης
    πέφτει προσωρινά, ακόμη κι αν τελικά κάνουν τα ίδια παιδιά. Γι' αυτό διαβάζεται μαζί
    με τη [μέση ηλικία στην πρώτη γέννηση](mean_age_first_birth.qmd).

  mean_age_first_birth: |
    ## Τι δείχνει

    Τη μέση ηλικία των γυναικών όταν γεννούν το πρώτο τους παιδί, στο έτος αναφοράς.

    ## Πώς διαβάζεται

    Η άνοδός της σημαίνει ότι η απόκτηση παιδιών αναβάλλεται. Η αναβολή έχει δύο
    συνέπειες: όσο διαρκεί, χαμηλώνει προσωρινά τον
    [συνολικό δείκτη γονιμότητας](total_fertility_rate.qmd), και μικραίνει τα χρόνια
    που μένουν για δεύτερο ή τρίτο παιδί.

    ## Τι να προσέχετε

    Αφορά μόνο τις γυναίκες που γέννησαν πρώτο παιδί μέσα στο έτος, όχι όσες δεν έκαναν
    παιδιά. Για όλες τις γεννήσεις, όχι μόνο τις πρώτες, δείτε τη
    [μέση ηλικία της μητέρας στη γέννηση](mean_age_childbearing.qmd).

  mean_age_childbearing: |
    ## Τι δείχνει

    Τη μέση ηλικία των μητέρων στη γέννηση των παιδιών τους, για όλες τις γεννήσεις του
    έτους: πρώτο, δεύτερο ή επόμενο παιδί.

    ## Πώς διαβάζεται

    Όπως και η [μέση ηλικία στην πρώτη γέννηση](mean_age_first_birth.qmd), η άνοδός της
    δείχνει αναβολή των γεννήσεων. Η διαφορά ανάμεσα στις δύο ηλικίες δείχνει πόσο
    αργότερα από το πρώτο έρχονται τα επόμενα παιδιά.

    ## Τι να προσέχετε

    Επηρεάζεται από το πόσα παιδιά κάνει κάθε γυναίκα: όσο λιγότερα δεύτερα και τρίτα
    παιδιά, τόσο πιο κοντά είναι στη μέση ηλικία της πρώτης γέννησης.

  life_expectancy_0: |
    ## Τι δείχνει

    Πόσα χρόνια θα ζούσε κατά μέσο όρο ένα παιδί που γεννιέται στο έτος αναφοράς, αν σε
    όλη τη ζωή του ίσχυαν τα ποσοστά θανάτων κατά ηλικία εκείνου του έτους.

    ## Πώς διαβάζεται

    Συνοψίζει σε έναν αριθμό τη θνησιμότητα σε όλες τις ηλικίες. Δεν εξαρτάται από την
    ηλικιακή δομή, άρα είναι ο σωστός δείκτης για να συγκρίνετε τη θνησιμότητα μεταξύ
    χωρών, Περιφερειών και ετών (σε αντίθεση με τον
    [αδρό δείκτη θνησιμότητας](crude_death_rate.qmd)).

    ## Τι να προσέχετε

    **Δεν είναι πρόβλεψη** του πόσο θα ζήσουν τα παιδιά που γεννιούνται σήμερα: αν η
    θνησιμότητα συνεχίσει να πέφτει, θα ζήσουν περισσότερο. Σε χρονιές με ασυνήθιστα
    πολλούς θανάτους, όπως στην πανδημία COVID-19, ο δείκτης πέφτει απότομα και
    ανακάμπτει όταν η θνησιμότητα επιστρέψει στα προηγούμενα επίπεδα.

  life_expectancy_65: |
    ## Τι δείχνει

    Πόσα χρόνια ζωής απομένουν κατά μέσο όρο σε όσους φτάνουν τα 65, αν από εκεί και
    πέρα ίσχυαν τα ποσοστά θανάτων κατά ηλικία του έτους αναφοράς.

    ## Πώς διαβάζεται

    Δείχνει πόσο διαρκεί η ζωή μετά την ηλικία που παραδοσιακά συνδέεται με τη
    συνταξιοδότηση, και γι' αυτό χρησιμοποιείται στις συζητήσεις για τις συντάξεις και
    τη φροντίδα. Όπως το [προσδόκιμο ζωής στη γέννηση](life_expectancy_0.qmd), συγκρίνει
    χώρες και έτη.

    ## Τι να προσέχετε

    Μετρά τη διάρκεια της ζωής, όχι την υγεία: δεν λέει πόσα από αυτά τα χρόνια
    περνιούνται με καλή υγεία. Είναι μέγεθος ενός έτους, όχι πρόβλεψη.

  infant_mortality_rate: |
    ## Τι δείχνει

    Πόσα παιδιά πεθαίνουν πριν κλείσουν τον πρώτο χρόνο της ζωής τους, ανά χίλιες
    γεννήσεις ζώντων.

    ## Πώς διαβάζεται

    Είναι από τους πιο ευαίσθητους δείκτες της υγείας ενός πληθυσμού και της περίθαλψης
    γύρω από τον τοκετό. Χαμηλότερη τιμή είναι καλύτερη.

    ## Τι να προσέχετε

    Στις χώρες με χαμηλή βρεφική θνησιμότητα οι θάνατοι είναι λίγοι, οπότε ο δείκτης
    κυμαίνεται από έτος σε έτος χωρίς να έχει αλλάξει κάτι ουσιαστικό. Στις Περιφέρειες,
    με ακόμη λιγότερους θανάτους, οι διακυμάνσεις είναι μεγαλύτερες. Διαφορές στον τρόπο
    καταγραφής των πολύ πρόωρων γεννήσεων επηρεάζουν τις συγκρίσεις μεταξύ χωρών.

  median_age: |
    ## Τι δείχνει

    Την ηλικία που χωρίζει τον πληθυσμό σε δύο ίσα μισά: οι μισοί κάτοικοι είναι
    νεότεροι και οι μισοί μεγαλύτεροι.

    ## Πώς διαβάζεται

    Είναι η πιο απλή περίληψη της ηλικιακής σύνθεσης. Η άνοδός της σημαίνει ότι ο
    πληθυσμός γερνά, είτε επειδή γεννιούνται λιγότερα παιδιά είτε επειδή οι άνθρωποι
    ζουν περισσότερο είτε επειδή φεύγουν νέοι.

    ## Τι να προσέχετε

    Δεν δείχνει πώς κατανέμονται οι ηλικίες γύρω από το μέσο. Δύο πληθυσμοί με την ίδια
    διάμεση ηλικία μπορεί να έχουν πολύ διαφορετικό αριθμό ηλικιωμένων. Για αυτό δείτε
    το [ποσοστό των 65 ετών και άνω](population_share.qmd) και τον
    [δείκτη γήρανσης](ageing_index.qmd).

  sex_ratio: |
    ## Τι δείχνει

    Πόσοι άνδρες αντιστοιχούν σε κάθε εκατό γυναίκες, σε όλες τις ηλικίες μαζί. Τιμή
    κάτω από εκατό σημαίνει ότι οι γυναίκες είναι περισσότερες.

    ## Πώς διαβάζεται

    Γεννιούνται λίγο περισσότερα αγόρια από κορίτσια, αλλά οι γυναίκες ζουν κατά μέσο
    όρο περισσότερο. Έτσι οι άνδρες είναι περισσότεροι στις νεαρές ηλικίες και οι
    γυναίκες στις μεγάλες. Όσο γερνά ένας πληθυσμός, τόσο πέφτει ο λόγος φύλων. Τον
    αλλάζει επίσης η μετανάστευση, όταν μεταναστεύουν περισσότεροι άνδρες ή περισσότερες
    γυναίκες.

    ## Τι να προσέχετε

    Τον υπολογίζουμε εμείς από τον πληθυσμό κατά φύλο την 1η Ιανουαρίου· η Eurostat δεν
    τον δημοσιεύει ως ξεχωριστό δείκτη. Αφορά όλες τις ηλικίες μαζί, άρα κρύβει τις
    μεγάλες διαφορές ανάμεσα στις ηλικίες.

  population_share: |
    ## Τι δείχνει

    Το ποσοστό του πληθυσμού που είναι 65 ετών και άνω, την 1η Ιανουαρίου.

    ## Πώς διαβάζεται

    Είναι ο πιο άμεσος δείκτης της γήρανσης. Ανεβαίνει όταν γεννιούνται λιγότερα παιδιά
    (μικραίνουν οι νεότερες ηλικίες) και όταν οι άνθρωποι ζουν περισσότερο (μεγαλώνουν
    οι μεγαλύτερες).

    ## Τι να προσέχετε

    Το ποσοστό υπολογίζεται στα άτομα γνωστής ηλικίας. Τα 65 είναι συμβατικό όριο: δεν
    σημαίνει ότι όσοι τα έχουν περάσει είναι εξαρτώμενοι.

  old_age_dependency_ratio: |
    ## Τι δείχνει

    Πόσα άτομα 65 ετών και άνω αντιστοιχούν σε κάθε εκατό άτομα 15–64 ετών.

    ## Πώς διαβάζεται

    Συγκρίνει τον αριθμό των ηλικιωμένων με τον αριθμό των ανθρώπων σε ηλικία εργασίας,
    και γι' αυτό χρησιμοποιείται στις συζητήσεις για τις συντάξεις και την υγεία. Η
    άνοδός του σημαίνει ότι λιγότεροι άνθρωποι σε ηλικία εργασίας αντιστοιχούν σε κάθε
    ηλικιωμένο.

    ## Τι να προσέχετε

    Είναι δείκτης **ηλικιών**, όχι οικονομικής εξάρτησης: δεν εργάζονται όλοι όσοι είναι
    15–64 ετών, ούτε είναι εξαρτώμενοι όλοι όσοι έχουν περάσει τα 65. Η οικονομική
    επιβάρυνση εξαρτάται και από την απασχόληση, την ηλικία συνταξιοδότησης και την
    υγεία.

  young_age_dependency_ratio: |
    ## Τι δείχνει

    Πόσα παιδιά 0–14 ετών αντιστοιχούν σε κάθε εκατό άτομα 15–64 ετών.

    ## Πώς διαβάζεται

    Ακολουθεί τις γεννήσεις: όταν γεννιούνται λιγότερα παιδιά, πέφτει. Μια πτώση του
    σήμερα σημαίνει λιγότερους ανθρώπους σε ηλικία εργασίας σε δεκαπέντε χρόνια.

    ## Τι να προσέχετε

    Όπως ο [δείκτης εξάρτησης ηλικιωμένων](old_age_dependency_ratio.qmd), είναι δείκτης
    ηλικιών, όχι οικονομικής εξάρτησης.

  total_age_dependency_ratio: |
    ## Τι δείχνει

    Πόσα άτομα κάτω των 15 και άνω των 64 ετών αντιστοιχούν σε κάθε εκατό άτομα 15–64
    ετών: το άθροισμα του [δείκτη εξάρτησης νέων](young_age_dependency_ratio.qmd) και
    του [δείκτη εξάρτησης ηλικιωμένων](old_age_dependency_ratio.qmd).

    ## Πώς διαβάζεται

    Δείχνει το σύνολο των ηλικιών εκτός εργασίας απέναντι στις ηλικίες εργασίας. Η ίδια
    τιμή μπορεί να προκύπτει από πολλά παιδιά και λίγους ηλικιωμένους ή από το
    αντίστροφο, γι' αυτό διαβάζεται μαζί με τα δύο μέρη του.

    ## Τι να προσέχετε

    Είναι δείκτης ηλικιών, όχι οικονομικής εξάρτησης.

  ageing_index: |
    ## Τι δείχνει

    Πόσα άτομα 65 ετών και άνω αντιστοιχούν σε κάθε εκατό παιδιά 0–14 ετών.

    ## Πώς διαβάζεται

    Τιμή πάνω από εκατό σημαίνει ότι οι ηλικιωμένοι είναι περισσότεροι από τα παιδιά.
    Ανεβαίνει και από τις δύο πλευρές: λιγότερες γεννήσεις και μεγαλύτερη διάρκεια ζωής.

    ## Τι να προσέχετε

    Τον υπολογίζουμε εμείς από τον πληθυσμό κατά ηλικία· η Eurostat δεν τον δημοσιεύει.
    Τα άτομα άγνωστης ηλικίας δεν μετρούν.
